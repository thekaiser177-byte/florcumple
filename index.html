<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Flor!</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050011;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        
        #title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            pointer-events: none;
            text-shadow: 0 0 10px #ff66cc, 0 0 20px #9933ff;
            z-index: 10;
        }

        #info-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(20, 5, 40, 0.9);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 102, 204, 0.5);
            border-radius: 20px;
            padding: 25px;
            color: white;
            text-align: center;
            width: 320px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(153, 51, 255, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 20;
        }

        #info-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Estilo para que el texto largo se vea bien */
        #info-card::-webkit-scrollbar {
            width: 5px;
        }
        #info-card::-webkit-scrollbar-thumb {
            background: #ff66cc;
            border-radius: 10px;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #ff66cc;
            margin: 0 auto 15px auto;
            border: 3px solid #fff;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 15px #ff66cc;
        }

        .name-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #e0b3ff;
        }

        .message-text {
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 20px;
            font-weight: 400;
            text-align: justify;
            white-space: pre-line; /* Esto asegura que los saltos de línea se respeten */
        }

        .close-btn {
            background: linear-gradient(45deg, #ff66cc, #9933ff);
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.05);
        }

        #instruction {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1 id="title">¡Feliz Cumpleaños Flor! 🌸</h1>
    <div id="instruction">Arrastra para mover el universo • Toca un planeta para acercarte</div>

    <div id="canvas-container"></div>

    <div id="info-card">
        <div class="profile-pic" id="card-img"></div>
        <div class="name-title" id="card-name">Nombre</div>
        <div class="message-text" id="card-message"></div>
        <button class="close-btn" onclick="closeCard()">Volver al Universo</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050011, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 60;
        controls.minDistance = 5;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        
        const centerLight = new THREE.PointLight(0xffffff, 2.5, 100);
        scene.add(centerLight);

        const textureLoader = new THREE.TextureLoader();

        // ESTRELLAS
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);
        const colorPink = new THREE.Color(0xff66cc);
        const colorPurple = new THREE.Color(0x9933ff);

        for(let i = 0; i < particlesCount * 3; i+=3) {
            posArray[i] = (Math.random() - 0.5) * 100;
            posArray[i+1] = (Math.random() - 0.5) * 100;
            posArray[i+2] = (Math.random() - 0.5) * 100;
            const mixedColor = colorPink.clone().lerp(colorPurple, Math.random());
            colorsArray[i] = mixedColor.r;
            colorsArray[i+1] = mixedColor.g;
            colorsArray[i+2] = mixedColor.b;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        const particleMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleMesh);

        // PLANETAS
        const personas = ["Leiver", "Mai", "Simón", "Juan", "Daniel", "Carlos", "Abraham", "Frank", "Miguel", "Dilia", "Duno"];
        const planetsGroup = new THREE.Group();
        scene.add(planetsGroup);
        const interactableObjects = [];

        // SOL CENTRAL
        const sunGroup = new THREE.Group();
        scene.add(sunGroup);
        const sunMeshes = [];
        
        // --- SECCIÓN MODIFICADA: Ahora hay 7 imágenes ---
        const sunImages = ['sol1.jpg', 'sol2.jpg', 'sol3.jpg', 'sol4.jpg', 'sol5.jpg', 'sol6.jpg', 'sol7.jpg']; 
        // ---------------------------------------------------

        const sphereGeo = new THREE.SphereGeometry(1.5, 32, 32);

        // --- SECCIÓN MODIFICADA: Loop dinámico ---
        for(let i = 0; i < sunImages.length; i++) {
            const mat = new THREE.MeshBasicMaterial({ map: textureLoader.load(sunImages[i]), transparent: true, opacity: i === 0 ? 1 : 0 });
            const sunSphere = new THREE.Mesh(sphereGeo, mat);
            sunSphere.scale.set(2.5, 2.5, 2.5);
            sunGroup.add(sunSphere);
            sunMeshes.push(sunSphere);
        }
        // ---------------------------------------------------

        // --- SECCIÓN MODIFICADA: Animación dinámica ---
        let currentSunIndex = 0;
        setInterval(() => {
            const nextSunIndex = (currentSunIndex + 1) % sunImages.length; // Ciclo dinámico según el array
            gsap.to(sunMeshes[currentSunIndex].material, { opacity: 0, duration: 1.5 });
            gsap.to(sunMeshes[nextSunIndex].material, { opacity: 1, duration: 1.5 });
            currentSunIndex = nextSunIndex;
        }, 3000);
        // ---------------------------------------------------

        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = "bold 32px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "#ff66cc"; ctx.shadowBlur = 10;
            ctx.fillText(text, 128, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
            sprite.scale.set(5, 2.5, 1);
            return sprite;
        }

        const radius = 13;
        const ringGeo = new THREE.RingGeometry(2, 2.2, 32);

        personas.forEach((nombre, index) => {
            const angle = (index / personas.length) * Math.PI * 2;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const cleanName = nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const imageFileName = `${cleanName}foto.jpg`;

            const planetMat = new THREE.MeshStandardMaterial({ map: textureLoader.load(imageFileName), roughness: 0.3, metalness: 0.1 });
            const planet = new THREE.Mesh(sphereGeo, planetMat);
            planet.position.set(x, 0, z);
            planet.userData = { name: nombre, photoUrl: imageFileName };

            const ringMat = new THREE.MeshBasicMaterial({ color: index % 2 === 0 ? 0x9933ff : 0xff66cc, side: THREE.DoubleSide, transparent: true, opacity: 0.75 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            planet.add(ring);

            const nameSprite = createTextSprite(nombre);
            nameSprite.position.set(0, 2.5, 0);
            planet.add(nameSprite);

            planetsGroup.add(planet);
            interactableObjects.push(planet);
        });

        // INTERACCIÓN
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isFocused = false;
        let pStartX = 0, pStartY = 0;

        window.addEventListener('pointerdown', (e) => { pStartX = e.clientX; pStartY = e.clientY; });
        window.addEventListener('pointerup', (e) => {
            if(isFocused) return;
            if (Math.abs(e.clientX - pStartX) > 5 || Math.abs(e.clientY - pStartY) > 5) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);
            if (intersects.length > 0) focusPlanet(intersects[0].object);
        });

        function focusPlanet(planet) {
            isFocused = true;
            controls.enabled = false;
            const worldPos = new THREE.Vector3();
            planet.getWorldPosition(worldPos);
            gsap.to(camera.position, { x: worldPos.x + 3, y: worldPos.y + 2, z: worldPos.z + 4, duration: 1.5 });
            gsap.to(controls.target, { x: worldPos.x, y: worldPos.y, z: worldPos.z, duration: 1.5, onUpdate: () => controls.update(), onComplete: () => showCard(planet.userData) });
        }

        function showCard(data) {
            document.getElementById('card-name').innerText = data.name;
            document.getElementById('card-img').style.backgroundImage = `url('${data.photoUrl}')`;
            
            const messageBox = document.getElementById('card-message');
            
            // Asignar el mensaje correcto dependiendo del planeta
            switch(data.name) {
                case "Leiver":
                    messageBox.innerText = "Feliz cumpleaños a la única e inigualable Flor Josefina. Te escribo esto porque quería que supieras lo mucho que te valoro. Me siento muy orgulloso de ser tu amigo y de ver cómo vas logrando tus cosas con esa personalidad tan única que tienes. Gracias por tu amistad y por tu energía, personas como tu no se encuentran todos los días. Disfruta mucho tus 19, deja de cobrarme el agua por un día al menos sea seria mira que te empiezo a cobrar las fotos de la pizarra entonces sieee JSJSJSKSSJJS, y recuerda que aquí tienes a alguien que te admira y te apoya en todas tus metas. En este poco tiempo que llevo de conocerte me encariñé contigo y gracias por darme la confianza de dejarme escucharte cuando necesitas ayuda, sabes que siempre ahí estaré cuando lo necesites aunque no lo sepa demostrar. Se le quiere att jhonkleiverson alejandreison casanoveishon II \n\n(Nota: vamos a ver si dejas de decir tantos chinazos)";
                    break;
                case "Mai":
                    messageBox.innerText = "Querida, linda y extraordinaria Flor, ya ha pasado un año desde q nos conocimos y se nos olvido felicitarte en tu cumpleaños (xq no sabiamos) y hoy x primera vez lo haremos de una manera hermosa.\n\nEsto me llena de alegría y espero que también tu corazón esté alegre, y listo para recibir todo el cariño de quienes te amamos.\n\nPorque alguien tan especial y única como tú, merece todo lo mejor q existe en esa vida. Mereces que el cielo se abra y se derramen sobre tu vida las mejores bendiciones.\n\nEres hermosa, x dentro y x fuera, te adoro. ¡Felicitaciones x tu cumpleaños! Q tu día sea feliz e inolvidable, y q tu camino x la vida sea siempre iluminado x la paz y el amor.";
                    break;
                case "Simón":
                    messageBox.innerText = "¡Claro! Aquí tienes un texto de cumpleaños con chistes y un toque divertido:\n\nQuerida amiga Flor, ¡Feliz cumpleaños! Espero que este día esté lleno de risas, alegría y mucha diversión.\nDicen que los años no pasan en vano, pero en tu caso parecen pasar volando, ¡será porque siempre estás tan ocupada viendo memes! ¡Aunque con lo joven que eres, eso es lo único que puedes ver!\nEn serio, amiga, eres una joya y siempre me haces reír con tus ocurrencias. Agradezco cada sonrisa que me regalas y cada momento que compartimos juntas.\nPor cierto, antes de que se me olvide, déjame decirte que me voy a casar... ¡con tu prima! ¡Así que prepárate para ser mi dama de honor y planear la boda más divertida de todas!\nQue este cumpleaños sea el inicio de un año lleno de éxitos, amor y sobre todo, muchos momentos felices. ¡Te adoro, amiga! ¡Que viva la fiesta!";
                    break;
                case "Juan":
                    messageBox.innerText = "Duende digo flor, feliz cumpleaños espero que la pases super bien y que lo superes pronto digo que me des torta";
                    break;
                case "Daniel":
                    messageBox.innerText = "Para la mejor migajera que eh conocido, muchas felicidades por estos 19 años que estas cumpliendo espero que la pases muy bien y en la vida te vaya de lo mejor y espero celebrar muchos cumpleaños más entre todos";
                    break;
                case "Carlos":
                    messageBox.innerText = "Feliz cumpleaños flor tropical 💐 jeje que cumplas muchos años más 1️⃣9️⃣, qué Dios🙏🏽 te de mucha vida y salud, que el poli te da paciencia😁, te deseo que tengas un excelente y feliz cumpleaños que lo disfrutes mucho🎂(y el cumpleaños😂). Eres una gran amiga a la que le tengo mucho aprecio, no te pido que no cambies porque es imposible, pero si lo haces que sea para bien como tú sabes una mejor versión florística jeje, dónde tú mejor versión te haga feliz, se sabes que pasas por problemas difíciles pero eres chiquita y fuerte, sabes que aquí estamos todos apoyándote para lo que necesites, se te quiere, un fuerte abrazo 🫂 de oso 🐻....feliz cumpleaños 🎂🥹";
                    break;
                case "Abraham":
                    messageBox.innerText = '"FELIZ CUMPLEAÑOS A MI ENANA FAVORITA, A MI HEROINA QUE ME SALVO DE CALCULO, ESTARÉ ETERNAMENTE AGRADECIDO HASTA EL FIN DE LOS DÍAS, PA DONDE TU ME DIGAS YO VOY ASI SEA A PIE, AL QUE ME DIGAS PARA MATAR LO MATAMOS, SI ME DICES OA ROBAR ROBAMOS"';
                    break;
                case "Frank":
                    messageBox.innerText = "Feliz cumpleaños flor espero que tes pasandola arrecho en tu cumpleaños y coño aprovecho pa decir que tú eres bastante chevere y que la pases bien";
                    break;
                case "Miguel":
                    messageBox.innerText = "¡Feliz cumpleaños a esa amiga \n\nPara el “chichón de piso” \nQue este año sigas causando estragos en la vida de los demás, y demostrando que lo pequeño no solo es bonito… sino letal\n\nQue tu día tenga más risas que insultos, más pastel que regaños, y que ninguna puerta baja ni repisa traicionera te amargue la fiesta.";
                    break;
                case "Dilia":
                    messageBox.innerText = "¡Claro que sí! Aquí tienes una opción de carta que se siente muy personal, auténtica y lista para que la ajustes si quieres agregar algún detalle específico de ustedes.\n\n¡Feliz Cumpleaños!\nQuerido/a [Nombre del amigo/a]:\nHoy no es un día cualquiera, es el día en que celebramos que estás en este mundo y, sobre todo, que estás en mi vida. Quería aprovechar este cumpleaños para decirte, de forma un poco más pausada, lo mucho que valoro nuestra amistad.\nA veces la rutina nos hace olvidar decir las cosas importantes, pero quiero que sepas que admiro mucho la persona en la que te has convertido. Gracias por todas las risas, por estar ahí en los momentos en que las cosas se ponen cuesta arriba y por ser ese refugio donde siempre puedo ser yo mismo/a sin filtros.\nEspero que este nuevo año de vida venga cargado de proyectos que te emocionen, de salud y de muchos momentos que nos hagan reír hasta que nos duela la cara. Te mereces todo lo bueno que te pase y mucho más.\nPásalo increíble hoy, rodéate de la gente que te quiere (donde obviamente me incluyo) y prepárate, porque este año vamos a crear recuerdos todavía mejores.\n¡Te quiero mucho y feliz cumple!";
                    break;
                case "Duno":
                    messageBox.innerText = "Feliz cumpleaños, Flor! Sé lo mucho que te gustan las cartas, así que no quería dejar pasar este día sin escribirte unas palabras.\nQuiero que sepas que estoy muy orgulloso de ti y que siempre estoy pendiente de tu salud; eres muy importante para mí. También aprovecho para pedirte una disculpa si a veces mis actitudes son un poco bruscas, pero espero que sepas que esa es mi forma particular de demostrarte mi cariño. Te quiero mucho, amiga. ¡Que pases un día increíble!";
                    break;
                default:
                    messageBox.innerText = "¡Feliz cumpleaños Flor! Te deseo lo mejor en este día tan especial.";
            }

            document.getElementById('info-card').classList.add('active');
        }

        window.closeCard = function() {
            document.getElementById('info-card').classList.remove('active');
            gsap.to(camera.position, { x: 0, y: 15, z: 30, duration: 1.5 });
            gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1.5, onUpdate: () => controls.update(), onComplete: () => { isFocused = false; controls.enabled = true; } });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            particleMesh.rotation.y = time * 0.02;
            if(!isFocused) {
                planetsGroup.rotation.y = time * 0.2; 
                sunGroup.rotation.y = time * 0.05;
            }
            planetsGroup.children.forEach((p, i) => {
                p.position.y = Math.sin(time * 2 + i) * 0.5;
                p.rotation.y += 0.01;
            });
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
